<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4">
<title>Haq हक़</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%231F5E3B'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4EFE4; --surface: #FFFDF8; --ink: #1B1A17; --muted: #6B665C; --line: #E3DCCD;
    --accent: #1F5E3B; --accent-soft: #E3EEE6; --accent-ink: #FFFFFF;
    --warn: #B4503A; --warn-soft: #F6E3DD;
    --amber: #8A5A12; --amber-soft: #FBEBC8;
    --radius: 22px; --shadow: 0 1px 2px rgba(27, 26, 23, .06), 0 6px 18px rgba(27, 26, 23, .06);
    --font-en: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-hi: "Kohinoor Devanagari", "Noto Sans Devanagari", "Mangal", "Nirmala UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font-hi); font-size: 19px; line-height: 1.45; min-height: 100dvh; }
  html[lang="en"] body { font-family: var(--font-en); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  a { color: inherit; }
  .app { max-width: 480px; margin: 0 auto; padding: 12px 16px calc(32px + env(safe-area-inset-bottom)); }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .mini-mark { font-weight: 800; font-size: 20px; letter-spacing: -.01em; visibility: hidden; }
  .mini-mark.on { visibility: visible; }
  .toggle { display: flex; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; }
  .toggle button { min-width: 52px; min-height: 44px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 16px; color: var(--muted); }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .toggle.hidden { visibility: hidden; }

  .screen { display: none; animation: in .25s ease; }
  .screen.on { display: block; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }

  /* language screen */
  .lang-screen { min-height: 78dvh; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; }
  .wordmark { font-family: var(--font-en); font-weight: 800; font-size: 56px; letter-spacing: -.03em; line-height: 1; }
  .wordmark span { font-family: var(--font-hi); font-weight: 700; color: var(--accent); margin-left: 10px; }
  .big-choice { display: block; width: 100%; min-height: 84px; border-radius: var(--radius); background: var(--surface);
                border: 2px solid var(--line); font-size: 30px; font-weight: 700; box-shadow: var(--shadow); }
  .big-choice:active { transform: scale(.98); }
  .big-choice.hi { font-family: var(--font-hi); }
  .big-choice.en { font-family: var(--font-en); }

  /* start */
  .start { min-height: 78dvh; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 8px; }
  .promise { font-size: 22px; color: var(--muted); margin: 10px 0 0; max-width: 22ch; }
  .prompt { font-size: 26px; font-weight: 700; margin: 34px 0 18px; }
  .mic { width: 168px; height: 168px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
         font-size: 68px; box-shadow: 0 10px 30px rgba(31, 94, 59, .35); position: relative; }
  .mic:active { transform: scale(.97); }
  .mic.listening::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--accent);
                          animation: ring 1.2s infinite; }
  @keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.25); } }
  .heard { min-height: 28px; margin-top: 16px; color: var(--muted); font-size: 18px; max-width: 30ch; }
  .link-btn { margin-top: 18px; min-height: 56px; padding: 0 22px; border-radius: 999px; border: 2px solid var(--ink);
              font-weight: 700; font-size: 20px; }
  .text-btn { margin-top: 10px; min-height: 48px; color: var(--muted); text-decoration: underline; font-size: 17px; }

  /* generic */
  h2 { font-size: 26px; line-height: 1.25; margin: 8px 0 18px; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .primary { width: 100%; min-height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
             font-weight: 700; font-size: 22px; margin-top: 18px; }
  .primary:disabled { opacity: .45; }
  .option:disabled { opacity: .5; }
  .ghost { min-height: 52px; padding: 0 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
  textarea { width: 100%; min-height: 160px; font: inherit; font-size: 20px; padding: 16px; border-radius: 18px;
             border: 2px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }
  textarea:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .speak { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 22px; flex: none; }

  /* builder */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { min-height: 56px; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line);
          font-size: 19px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .chip .e { font-size: 24px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #roleChips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  #roleChips .chip { justify-content: flex-start; white-space: nowrap; font-size: 18px; padding: 0 12px; gap: 8px; min-width: 0; }
  #roleChips .chip .e { font-size: 22px; }
  .section-label { font-size: 17px; font-weight: 700; color: var(--muted); margin: 22px 0 10px; }
  .member { margin-top: 12px; padding: 14px; }
  .member-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 21px; margin-bottom: 10px; }
  .member-head .x { width: 44px; height: 44px; border-radius: 50%; background: var(--warn-soft); color: var(--warn); font-size: 22px; }
  .member .chip { min-height: 48px; font-size: 17px; padding: 0 12px; }
  .sticky-go { position: sticky; bottom: 0; padding: 12px 0 calc(8px + env(safe-area-inset-bottom));
               background: linear-gradient(to bottom, rgba(244, 239, 228, 0), var(--bg) 30%); }
  .sticky-go .primary { margin-top: 0; }

  /* follow-up */
  .q-step { color: var(--muted); font-weight: 600; font-size: 16px; }
  .q-row { display: flex; gap: 12px; align-items: flex-start; }
  .q-row h2 { flex: 1; margin-top: 4px; }
  .options { display: grid; gap: 12px; }
  .option { min-height: 72px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); font-size: 22px;
            font-weight: 700; box-shadow: var(--shadow); padding: 0 16px; }
  .option:active { background: var(--accent); color: var(--accent-ink); }

  /* working */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .step { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 16px; padding: 14px 16px;
          box-shadow: var(--shadow); font-size: 18px; animation: in .25s ease; }
  .step .i { width: 26px; flex: none; text-align: center; font-size: 20px; line-height: 1.35; }
  .step.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .step.sub { margin-left: 24px; }
  .spin { display: inline-block; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%;
          border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* results */
  .headline { background: var(--accent); color: var(--accent-ink); border-radius: 26px; padding: 22px 20px; position: relative; }
  .headline .l { font-size: 20px; opacity: .92; }
  .headline .amt { font-size: 52px; font-weight: 800; line-height: 1.05; margin: 6px 0; letter-spacing: -.02em; font-family: var(--font-en); }
  .headline .l2 { font-size: 20px; }
  .headline .amt .unit { font-size: 22px; font-weight: 700; margin-left: 4px; letter-spacing: 0; }
  .headline .split { margin-top: 12px; font-size: 18px; font-weight: 600; background: rgba(255,255,255,.14);
                     border-radius: 12px; padding: 8px 12px; }
  .check-chips { margin-top: 12px; gap: 8px; }
  .check-chips .chip { min-height: 44px; font-size: 16px; padding: 0 12px; background: rgba(255,255,255,.95);
                       border-color: transparent; color: var(--amber); }
  .scheme.flash { outline: 4px solid var(--amber); outline-offset: 2px; transition: outline-color .6s; }
  .section-head { margin: 30px 4px 4px; }
  .section-head h2 { margin: 0; font-size: 24px; }
  .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
  .cover { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 6px; }
  .cover .pay, .cover .get { border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: 18px; font-family: var(--font-en); }
  html[lang="hi"] .cover .pay, html[lang="hi"] .cover .get { font-family: var(--font-hi); }
  .cover .pay { background: var(--warn-soft); color: var(--warn); }
  .cover .get { background: var(--accent-soft); color: var(--accent); }
  .headline .speak { position: absolute; top: 16px; right: 16px; z-index: 2; background: rgba(255,255,255,.18); color: #fff; }
  .headline .l { padding-right: 56px; }   /* keep text clear of the read-aloud button */
  .scheme { margin-top: 14px; padding: 18px; }
  .scheme-top { display: flex; gap: 12px; align-items: flex-start; }
  .scheme .emoji { font-size: 46px; line-height: 1; }
  .scheme h3 { margin: 2px 0 4px; font-size: 21px; line-height: 1.25; font-family: var(--font-en); }
  .scheme .who { color: var(--muted); font-size: 17px; }
  .scheme .money { font-size: 28px; font-weight: 800; color: var(--accent); margin: 12px 0 6px; font-family: var(--font-en); }
  .scheme .money.soft { color: var(--amber); }
  .badge { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 700; margin: 4px 0 8px; }
  .badge.ok { background: var(--accent-soft); color: var(--accent); }
  .badge.check { background: var(--amber-soft); color: var(--amber); border-radius: 14px; }
  .badge.have { background: var(--line); color: var(--muted); }
  .benefit { font-size: 18px; }
  .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .doc { display: inline-flex; gap: 6px; align-items: center; background: var(--bg); border-radius: 12px; padding: 6px 10px; font-size: 15px; }
  .doc .e { font-size: 18px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .apply { flex: 1; min-height: 54px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px; }
  .where { margin-top: 10px; font-size: 17px; background: var(--bg); border-radius: 14px; padding: 12px; }
  .where a { display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 10px;
             border-radius: 14px; border: 2px solid var(--accent); font-weight: 700; color: var(--accent); text-decoration: none; }
  .src { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px; font-size: 15px; color: var(--muted); }
  .bottom { display: grid; gap: 10px; margin-top: 22px; }
  .answer { margin-top: 14px; }
  .err { color: var(--warn); font-weight: 600; margin-top: 12px; }
  .sticky-go .err { margin: 0 0 8px; background: var(--warn-soft); border-radius: 12px; padding: 8px 12px; }
  .conn { margin-top: 14px; background: var(--amber-soft); color: var(--amber); font-weight: 700; border-radius: 14px; padding: 12px 14px; }
  .ask-box textarea { min-height: 96px; }
  .primary.busy { opacity: .6; pointer-events: none; }
  @media (max-width: 360px) { .wordmark { font-size: 46px; } .headline .amt { font-size: 42px; } .mic { width: 148px; height: 148px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mini-mark" id="miniMark">Haq <span style="font-family:var(--font-hi);color:var(--accent)">हक़</span></div>
    <div class="toggle hidden" id="toggle" role="group" aria-label="Language">
      <button data-lang="hi" aria-pressed="false">हिं</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <!-- 0. language -->
  <section class="screen" id="s-lang">
    <div class="lang-screen">
      <div class="wordmark">Haq<span>हक़</span></div>
      <button class="big-choice hi" data-pick="hi">हिंदी</button>
      <button class="big-choice en" data-pick="en">English</button>
    </div>
  </section>

  <!-- 1. start -->
  <section class="screen" id="s-start">
    <div class="start">
      <div class="wordmark">Haq<span>हक़</span></div>
      <p class="promise" data-t="promise"></p>
      <div class="prompt" data-t="tell"></div>
      <button class="mic" id="mic" aria-label="mic">🎤</button>
      <div class="heard" id="heard"></div>
      <button class="link-btn" id="toBuilder" data-t="orTap"></button>
      <button class="text-btn" id="toType" data-t="orType"></button>
      <div class="err hidden" id="startErr"></div>
    </div>
  </section>

  <!-- 1b. type -->
  <section class="screen" id="s-type">
    <h2 data-t="tell"></h2>
    <textarea id="typeBox"></textarea>
    <div class="err hidden" id="typeErr" role="alert"></div>
    <button class="primary" id="typeGo" data-t="continue"></button>
    <button class="text-btn" data-back="s-start" data-t="back"></button>
  </section>

  <!-- 1c. builder -->
  <section class="screen" id="s-builder">
    <h2 data-t="whoLives"></h2>
    <div class="chips" id="roleChips"></div>
    <div id="members"></div>
    <div class="section-label" data-t="income"></div>
    <div class="chips" id="incomeChips"></div>
    <button class="text-btn" data-back="s-start" data-t="back"></button>
    <div class="sticky-go"><div class="err hidden" id="builderHint" role="alert"></div>
      <button class="primary" id="builderGo" data-t="continue"></button></div>
  </section>

  <!-- 1d. follow-up -->
  <section class="screen" id="s-follow">
    <div class="q-step" id="qStep"></div>
    <div class="q-row"><h2 id="qText"></h2><button class="speak" id="qSpeak" aria-label="read aloud">🔊</button></div>
    <div class="options" id="qOptions"></div>
  </section>

  <!-- 2. working -->
  <section class="screen" id="s-work">
    <h2 data-t="working"></h2>
    <ul class="steps" id="steps"></ul>
    <div class="conn hidden" id="conn" role="status"></div>
    <div class="err hidden" id="workErr"></div>
    <button class="primary hidden" id="retry" data-t="retry"></button>
  </section>

  <!-- 3. results -->
  <section class="screen" id="s-results">
    <div class="headline">
      <button class="speak" id="sayHeadline" aria-label="read aloud">🔊</button>
      <div class="l" id="headA"></div>
      <div class="amt"><span id="amt"></span><span class="unit" id="amtUnit"></span></div>
      <div class="l2" id="headB"></div>
      <div class="chips check-chips hidden" id="checkChips"></div>
      <div class="split" id="split"></div>
      <div class="split hidden" id="oneTime"></div>
    </div>
    <div id="cards"></div>
    <div class="bottom">
      <button class="ghost" id="askBtn" data-t="ask"></button>
      <div class="ask-box hidden" id="askBox">
        <textarea id="askText" rows="3"></textarea>
        <button class="primary" id="askSend" data-t="send"></button>
      </div>
      <div class="card answer hidden" id="answer"></div>
      <button class="text-btn" id="restart" data-t="newFamily"></button>
    </div>
  </section>
</div>

<script>
// ---------------------------------------------------------------- text
const T = {
  hi: {
    promise: "सरकारी योजनाएँ जो आपके परिवार का हक़ हैं",
    tell: "अपने परिवार के बारे में बताइए",
    tellSpeak: "अपने परिवार के बारे में बताइए। कौन-कौन है, क्या काम करते हैं।",
    orTap: "या छूकर बताइए 👆", orType: "लिखकर बताइए", continue: "आगे बढ़ें", back: "← वापस",
    listening: "सुन रहा हूँ…", heardNothing: "सुनाई नहीं दिया — फिर से दबाइए", noMic: "इस ब्राउज़र में माइक नहीं चलता — नीचे लिखिए",
    whoLives: "घर में कौन-कौन है? छूकर जोड़िए", income: "परिवार की कमाई",
    working: "आपकी योजनाएँ ढूँढ रहे हैं…", retry: "फिर से कोशिश करें",
    headA: "आपके परिवार का", unit: "/साल तक", headB: "का हक़ बाकी है",
    confirmN: (n) => `${n} बातें पक्की करें →`, oneTimeUnitUpTo: "तक एक बार की मदद",
    sayConfirm: (n, x, items, oneTime) => `${n} बातें पक्की करें: ${items}. इससे ${x} ${oneTime ? "तक एक बार की मदद" : "प्रति साल तक"} पक्का हो सकता है.`,
    split: (a, b) => b ? `${a} पक्का · ${b} जाँच के बाद` : `${a} पक्का`,
    oneTimeLine: (x) => `+ ${x} एक बार मिलने वाली मदद (हर साल नहीं)`, oneTimeUnit: "एक बार",
    onePension: "एक व्यक्ति को एक ही पेंशन मिलती है — ऊपर की रकम में इनमें से एक ही जोड़ी है।",
    sayOneTime: (x) => `इसके अलावा ${x} एक बार मिलने वाली मदद.`,
    protection: "सुरक्षा", protectionNote: "बीमा: आप छोटा प्रीमियम भरते हैं, मुसीबत में परिवार को पैसा मिलता है। यह ऊपर की रकम में नहीं जुड़ा।",
    premium: (x) => `आप भरें: ${x}/साल`, cover: (x, kind) => `${kind === "life" ? "जीवन बीमा" : "दुर्घटना बीमा"}: ${x}`,
    sayProtection: (c, pay, get) => `${c.name}. ${c.member} के लिए. ${pay}. ${get}. ${c.benefit}. आवेदन: ${c.where_to_apply}`,
    ask: "🎤 कुछ पूछना है?", newFamily: "नया परिवार", step: (i, n) => `सवाल ${i} / ${n}`,
    confirmed: "✓ पक्का (सरकारी स्रोत)", check: "जाँच ज़रूरी:", have: "पहले से मिल रही",
    perYear: "/ साल", whereApply: "कहाँ आवेदन करें", openSite: "वेबसाइट खोलें →", source: "सरकारी स्रोत ↗",
    forWho: "किसके लिए:", docs: "ज़रूरी कागज़:", err: "माफ़ कीजिए, कुछ गड़बड़ हुई। फिर से कोशिश करें।",
    offline: "इंटरनेट नहीं मिल रहा। जुड़ने पर फिर से कोशिश करें।",
    needMore: "हम आपका परिवार समझ नहीं पाए। बताइए घर में कौन-कौन है और क्या काम करते हैं — या छूकर बताइए।",
    emptyText: "पहले कुछ लिखिए — घर में कौन-कौन है?", noMembers: "पहले परिवार के लोग जोड़िए (ऊपर छूकर)।",
    conn: "कनेक्शन टूट गया — फिर से जोड़ रहे हैं…", micBlocked: "माइक की इजाज़त नहीं है — लिखकर बताइए।",
    send: "भेजें", askPlaceholder: "अपना सवाल लिखिए…",
    none: "अभी कोई पक्की योजना नहीं मिली।",
    ev: {

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json" },
                                body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function renderSteps(d) {

  const finished = ev.some(e => e.type === "done");
  for (const e of ev) {
    if (e.type === "understood") items.push(["✓", E.understood]);
    else if (e.type === "planned") {
      items.push(["✓", E.planned(e.schemes)]);
      if (e.protection) items.push(["🛡️", E.plannedProtection(e.protection), "sub"]);
    }
    else if (e.type === "checking") {
      const out = doneSchemes.get(e.scheme_id);
      if (!out) items.push(["⏳", e.from_cache ? E.checkingCache(sname(e.scheme_id)) : E.checking(sname(e.scheme_id)), "", true]);
      else items.push([out === "confirmed" ? "✓" : out === "likely" ? "⚠️" : "–", E[out](sname(e.scheme_id))]);

  const atStake = {};
  r.cards.filter(c => c.category !== "protection" && c.verification !== "confirmed" && !c.already_receiving)
    .forEach(c => new Set(c.check_needed.map(checkKey)).forEach(k => atStake[k] = (atStake[k] || 0) + (c.annual_value_inr || 0)));
  const checks = Object.keys(atStake).sort((p, q) => atStake[q] - atStake[p] || p.localeCompare(q));

  return { a, b, x, y, checks, confirmMode, oneTimeOnly: x === 0 && y > 0 };
}
// Read-aloud says exactly what the headline shows.
function headlineSpeech(r) {
  const t = totals(r);
  if (t.confirmMode) {
    const items = t.checks.map(k => L().checks[k] || k).join(", ");
    return L().sayConfirm(t.checks.length, rupee(t.oneTimeOnly ? t.y : t.x), items, t.oneTimeOnly)
      + (t.a ? " " + L().split(rupee(t.a), t.b ? rupee(t.b) : "").replace("·", ",") + "." : "")
      + (!t.oneTimeOnly && t.y ? " " + L().sayOneTime(rupee(t.y)) : "");
  }
  return L().sayHeadline(rupee(t.x), rupee(t.a), t.b ? rupee(t.b) : "") + (t.y ? " " + L().sayOneTime(rupee(t.y)) : "");
}
function checkKey(k) { return k === "income_limit" ? "income" : k; }
function jumpToCheck(key) {
  const card = [...document.querySelectorAll("#cards .scheme")].find(el => (el.dataset.checks || "").split(",").map(checkKey).includes(key));
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "start" });
  card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600);
}
function renderResults(r, say) {
  lastResult = r; show("s-results");
  const t = totals(r);
  const chips = $("checkChips"); chips.innerHTML = "";
  if (t.confirmMode) {
    $("headA").textContent = L().confirmN(t.checks.length); $("headB").textContent = "";
    $("amt").textContent = rupee(t.oneTimeOnly ? t.y : t.x);
    $("amtUnit").textContent = t.oneTimeOnly ? " " + L().oneTimeUnitUpTo : L().unit;
    t.checks.forEach(k => chips.appendChild(chip("⚠️", L().checks[k] || k, false, () => jumpToCheck(k))));
  } else {
    $("headA").textContent = L().headA; $("headB").textContent = L().headB;
    $("amt").textContent = rupee(t.x); $("amtUnit").textContent = L().unit;
  }
  chips.classList.toggle("hidden", !t.confirmMode);
  // the confirmed / after-checks split only when something is confirmed (never "₹0 confirmed")
  $("split").classList.toggle("hidden", !t.a);
  $("split").textContent = t.a ? L().split(rupee(t.a), t.b ? rupee(t.b) : "") : "";
  const showOneTime = t.y && !t.oneTimeOnly;
  $("oneTime").classList.toggle("hidden", !showOneTime);
  $("oneTime").textContent = showOneTime ? L().oneTimeLine(rupee(t.y)) : "";
  const box = $("cards"); box.innerHTML = "";
  const money = r.cards.filter(c => c.category !== "protection"), protection = r.cards.filter(c => c.category === "protection");
  if (!money.length) { const p = document.createElement("div"); p.className = "card scheme"; p.textContent = L().none; box.appendChild(p); }
  money.forEach(c => box.appendChild(schemeCard(c)));
  if (protection.length) {
    const head = document.createElement("div"); head.className = "section-head";
    const h = document.createElement("h2"); h.textContent = "🛡️ " + L().protection;
    const p = document.createElement("p"); p.textContent = L().protectionNote;
    head.append(h, p); box.appendChild(head);
    protection.forEach(c => box.appendChild(schemeCard(c)));
  }
  $("answer").classList.add("hidden");
  if (say) speak(headlineSpeech(r));
}
function schemeCard(c) {
    const el = document.createElement("article"); el.className = "card scheme";
    if (c.verification !== "confirmed") el.dataset.checks = c.check_needed.join(",");
    const top = document.createElement("div"); top.className = "scheme-top";
    const em = document.createElement("div"); em.className = "emoji"; em.textContent = c.emoji;
    const head = document.createElement("div"); head.style.flex = "1";
    const h3 = document.createElement("h3"); h3.textContent = c.name;
    const who = document.createElement("div"); who.className = "who"; who.textContent = `${L().forWho} ${c.member}`;
    head.append(h3, who); top.append(em, head); el.appendChild(top);
    const prot = c.category === "protection" && c.protection;
    const money = !prot && c.annual_value_inr
      ? (c.one_time ? `${rupee(c.annual_value_inr)} ${L().oneTimeUnit}` : `${rupee(c.annual_value_inr)} ${L().perYear}`) : "";
    if (money) { const m = document.createElement("div"); m.className = "money" + (c.counts_toward_total ? "" : " soft"); m.textContent = money; el.appendChild(m); }
    let pay = "", get = "";
    if (prot) {
      pay = L().premium(rupee(prot.premium_inr_per_year)); get = L().cover(lakh(prot.cover_inr), prot.kind);
      const cv = document.createElement("div"); cv.className = "cover";
      const a = document.createElement("span"); a.className = "pay"; a.textContent = pay;
      const b = document.createElement("span"); b.className = "get"; b.textContent = get;
      cv.append(a, b); el.appendChild(cv);
    }
    const badge = document.createElement("div");
    if (c.already_receiving) { badge.className = "badge have"; badge.textContent = L().have; }
    else if (c.verification === "confirmed") { badge.className = "badge ok"; badge.textContent = L().confirmed; }
    else { badge.className = "badge check"; badge.textContent = `⚠️ ${L().check} ${checkText(c)}`; }
    el.appendChild(badge);
    const ben = document.createElement("div"); ben.className = "benefit"; ben.textContent = c.benefit; el.appendChild(ben);
    if (c.one_pension_note) { const n = document.createElement("div"); n.className = "badge check"; n.textContent = "ℹ️ " + L().onePension; el.appendChild(n); }
    if (c.documents.length) {
      const docs = document.createElement("div"); docs.className = "docs"; docs.setAttribute("aria-label", L().docs);
      c.documents.forEach(t => { const d = document.createElement("span"); d.className = "doc";
        const e = document.createElement("span"); e.className = "e"; e.textContent = docIcon(t); d.append(e, document.createTextNode(t)); docs.appendChild(d); });
      el.appendChild(docs);
    }
    const actions = document.createElement("div"); actions.className = "actions";
    const ap = document.createElement("button"); ap.className = "apply"; ap.textContent = "📍 " + L().whereApply;
    const say = document.createElement("button"); say.className = "speak"; say.textContent = "🔊"; say.setAttribute("aria-label", "read aloud");
    actions.append(ap, say); el.appendChild(actions);
    const where = document.createElement("div"); where.className = "where hidden";
    where.appendChild(document.createTextNode(c.where_to_apply));
    const url = /^https?:/.test(c.apply_url || "") ? c.apply_url : c.official_url;
    if (url) { const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = L().openSite; where.appendChild(a); }
    el.appendChild(where);
    ap.onclick = () => where.classList.toggle("hidden");
    const src = document.createElement("a"); src.className = "src"; src.href = c.official_url; src.target = "_blank"; src.rel = "noopener";
    src.textContent = L().source; el.appendChild(src);
    say.onclick = () => speak(prot ? L().sayProtection(c, pay, get)
                                   : L().sayCard(c, money, c.verification === "confirmed" ? "" : `${L().check} ${checkText(c)}. `));
    return el;
}
$("sayHeadline").onclick = () => lastResult && speak(headlineSpeech(lastResult));
async function sendQuestion(text) {
  if (busy || !text) return; busy = true; $("askSend").classList.add("busy");
  try {
    const r = await api(`/api/households/${hid}/ask`, { lang, text });
    $("answer").textContent = r.answer; $("answer").classList.remove("hidden"); speak(r.answer);
    $("askBox").classList.add("hidden"); $("askText").value = "";
    if (r.rerun) setTimeout(startWorking, 2500);
  } catch (e) { $("answer").textContent = netErr(e) ? L().offline : L().err; $("answer").classList.remove("hidden"); }
  finally { busy = false; $("askSend").classList.remove("busy"); }
}
function askByTyping(reason) {
  $("askBox").classList.remove("hidden"); $("askText").placeholder = L().askPlaceholder; $("askText").focus();
  if (reason) { $("answer").textContent = reason; $("answer").classList.remove("hidden"); }
}
$("askBtn").onclick = () => listen(sendQuestion, askByTyping);
$("askSend").onclick = () => sendQuestion($("askText").value.trim());
$("restart").onclick = () => {
  clearInterval(pollTimer); store.del("haq_hid"); hid = null; builder = { members: [], income: null };
  spokeWorking = false; $("heard").textContent = ""; $("typeBox").value = ""; renderBuilder();
  ["startErr", "typeErr", "builderHint", "conn", "answer", "askBox"].forEach(id => $(id).classList.add("hidden"));
  show("s-start");
};

// ---------------------------------------------------------------- boot
async function refresh() {
  const d = await api(`/api/households/${hid}?lang=${lang}`);
  schemes = d.schemes || schemes;
  if (d.result) renderResults(d.result, false);
  return d;
}
(async function boot() {
  if (!lang) { applyLang(); show("s-lang"); return; }   // first visit: choose language (Hindi if they skip)
  applyLang();
  if (hid) {
    try {
      const d = await api(`/api/households/${hid}?lang=${lang}`);
      schemes = d.schemes || {};
      if (d.result) { renderResults(d.result, false); return; }
      if (d.interview_done) { if (!d.running && d.run && d.run.status !== "done") await api(`/api/households/${hid}/run`, {}); startWorking(); return; }
    } catch { store.del("haq_hid"); hid = null; }
  }
  show("s-start");
})();
// Nothing chosen? Continue in Hindi after a short wait.
setTimeout(() => { if (!lang && current === "s-lang") { setLang("hi"); show("s-start"); } }, 12000);
</script>
